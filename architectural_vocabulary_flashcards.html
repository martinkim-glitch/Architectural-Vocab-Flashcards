<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Architectural Vocabulary Flashcards</title>
<style>
  :root{
    --bg:#f4f1ea;
    --paper:#fffdf8;
    --ink:#1f2528;
    --muted:#6d7477;
    --line:#d9d2c6;
    --accent:#263b47;
    --accent-soft:#dce5e8;
    --shadow:0 16px 45px rgba(31,37,40,.12);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      linear-gradient(rgba(38,59,71,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(38,59,71,.04) 1px, transparent 1px),
      var(--bg);
    background-size:28px 28px;
    color:var(--ink);
  }
  .app{max-width:980px;margin:0 auto;padding:42px 20px 60px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;margin-bottom:24px}
  h1{
    margin:0;
    font-family:Georgia, "Times New Roman", serif;
    font-weight:500;
    font-size:clamp(2rem,4vw,3.6rem);
    line-height:1;
    letter-spacing:-.03em;
  }
  .subtitle{color:var(--muted);margin:10px 0 0;max-width:620px;line-height:1.5}
  .count{font-size:.9rem;color:var(--muted);white-space:nowrap}
  .toolbar{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto auto;
    gap:10px;
    margin:18px 0 22px;
  }
  select,button{
    font:inherit;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--paper);
    color:var(--ink);
    padding:11px 14px;
  }
  button{cursor:pointer;transition:.18s ease}
  button:hover{transform:translateY(-1px);border-color:#aeb7bb}
  button.primary{background:var(--accent);color:white;border-color:var(--accent)}
  .card-wrap{perspective:1200px}
  .card{
    position:relative;
    min-height:430px;
    transform-style:preserve-3d;
    transition:transform .52s cubic-bezier(.2,.7,.2,1);
    cursor:pointer;
  }
  .card.flipped{transform:rotateY(180deg)}
  .face{
    position:absolute;
    inset:0;
    border:1px solid var(--line);
    border-radius:24px;
    background:var(--paper);
    box-shadow:var(--shadow);
    backface-visibility:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:52px 42px;
  }
  .face.back{transform:rotateY(180deg)}
  .eyebrow{
    position:absolute;
    top:24px;
    left:50%;
    transform:translateX(-50%);
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:var(--muted);
    white-space:nowrap;
  }
  .term{
    font-family:Georgia, "Times New Roman", serif;
    font-size:clamp(2.8rem,7vw,5.8rem);
    font-weight:500;
    letter-spacing:-.04em;
    line-height:1.04;
    margin:0;
  }
  .definition{
    max-width:720px;
    font-family:Georgia, "Times New Roman", serif;
    font-size:clamp(1.5rem,3.2vw,2.35rem);
    line-height:1.35;
    margin:0;
  }
  .hint{
    position:absolute;
    bottom:22px;
    color:var(--muted);
    font-size:.83rem;
  }
  .controls{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    gap:12px;
    align-items:center;
    margin-top:18px;
  }
  .controls .right{text-align:right}
  .progress{height:7px;background:#ded9cf;border-radius:999px;overflow:hidden;margin-top:18px}
  .progress > div{height:100%;width:0;background:var(--accent);transition:width .25s ease}
  .shortcuts{
    display:flex;
    gap:16px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:16px;
    color:var(--muted);
    font-size:.82rem;
  }
  kbd{
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:6px;
    padding:2px 6px;
    box-shadow:0 1px 0 rgba(0,0,0,.08);
    color:var(--ink);
  }
  @media (max-width:700px){
    header{display:block}
    .count{margin-top:12px}
    .toolbar{grid-template-columns:1fr 1fr}
    .toolbar select{grid-column:1/-1}
    .card{min-height:390px}
    .face{padding:48px 24px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Architectural Vocabulary</h1>
      <p class="subtitle">Flip through common architectural elements and spatial terms. Use the category filter to study in groups, or shuffle everything for recall practice.</p>
    </div>
    <div class="count" id="count"></div>
  </header>

  <div class="toolbar">
    <select id="category" aria-label="Filter by category"></select>
    <button id="shuffle">Shuffle</button>
    <button id="reset">Reset</button>
  </div>

  <div class="card-wrap">
    <div class="card" id="card" role="button" tabindex="0" aria-label="Flashcard. Press space to flip.">
      <section class="face front">
        <div class="eyebrow" id="categoryFront"></div>
        <h2 class="term" id="term"></h2>
        <div class="hint">Click or press Space to reveal</div>
      </section>
      <section class="face back">
        <div class="eyebrow" id="categoryBack"></div>
        <p class="definition" id="definition"></p>
        <div class="hint">Click or press Space to return</div>
      </section>
    </div>
  </div>

  <div class="progress"><div id="progressBar"></div></div>

  <div class="controls">
    <div><button id="prev">← Previous</button></div>
    <button class="primary" id="flip">Flip card</button>
    <div class="right"><button id="next">Next →</button></div>
  </div>

  <div class="shortcuts">
    <span><kbd>Space</kbd> flip</span>
    <span><kbd>←</kbd> previous</span>
    <span><kbd>→</kbd> next</span>
    <span><kbd>S</kbd> shuffle</span>
  </div>
</div>

<script>
const allCards = [{"term": "Gable", "definition": "Triangular wall at the end of a pitched roof.", "category": "Roofs & Silhouettes"}, {"term": "Eave", "definition": "Lower edge of a roof that projects beyond the wall.", "category": "Roofs & Silhouettes"}, {"term": "Ridge", "definition": "Highest horizontal line where two roof slopes meet.", "category": "Roofs & Silhouettes"}, {"term": "Hip", "definition": "External diagonal intersection of two roof slopes.", "category": "Roofs & Silhouettes"}, {"term": "Valley", "definition": "Internal angle where two roof slopes meet.", "category": "Roofs & Silhouettes"}, {"term": "Dormer", "definition": "Window structure projecting from a sloped roof.", "category": "Roofs & Silhouettes"}, {"term": "Parapet", "definition": "Low protective wall along the edge of a roof, balcony, or terrace.", "category": "Roofs & Silhouettes"}, {"term": "Cornice", "definition": "Projecting horizontal molding near the top of a building or wall.", "category": "Roofs & Silhouettes"}, {"term": "Pediment", "definition": "Triangular or curved ornamental element, commonly above an entrance.", "category": "Roofs & Silhouettes"}, {"term": "Cupola", "definition": "Small dome-like structure projecting from a roof.", "category": "Roofs & Silhouettes"}, {"term": "Spire", "definition": "Tall, tapering structure rising above a building.", "category": "Roofs & Silhouettes"}, {"term": "Turret", "definition": "Small tower projecting from or attached to a building.", "category": "Roofs & Silhouettes"}, {"term": "Mansard", "definition": "Roof with two slopes on each side, with the lower slope much steeper.", "category": "Roofs & Silhouettes"}, {"term": "Soffit", "definition": "Underside of an architectural element, especially an eave.", "category": "Roofs & Silhouettes"}, {"term": "Column", "definition": "Vertical structural or decorative support.", "category": "Structure & Supports"}, {"term": "Pillar", "definition": "Freestanding vertical support, generally less formally defined than a classical column.", "category": "Structure & Supports"}, {"term": "Pier", "definition": "Heavy vertical support carrying an arch, bridge, or substantial load.", "category": "Structure & Supports"}, {"term": "Post", "definition": "Simple vertical structural member.", "category": "Structure & Supports"}, {"term": "Stanchion", "definition": "Upright support, post, or brace.", "category": "Structure & Supports"}, {"term": "Beam", "definition": "Horizontal structural member carrying loads.", "category": "Structure & Supports"}, {"term": "Joist", "definition": "Repeated horizontal structural member supporting a floor or ceiling.", "category": "Structure & Supports"}, {"term": "Rafter", "definition": "Sloped structural member supporting a roof.", "category": "Structure & Supports"}, {"term": "Truss", "definition": "Framework of connected structural members, often triangular.", "category": "Structure & Supports"}, {"term": "Lintel", "definition": "Horizontal beam spanning an opening such as a door or window.", "category": "Structure & Supports"}, {"term": "Load-bearing wall", "definition": "Wall that carries structural loads.", "category": "Structure & Supports"}, {"term": "Partition", "definition": "Non-load-bearing interior wall dividing spaces.", "category": "Structure & Supports"}, {"term": "Buttress", "definition": "Projecting support built against a wall to resist outward forces.", "category": "Structure & Supports"}, {"term": "Flying buttress", "definition": "External arched support transferring force away from a wall.", "category": "Structure & Supports"}, {"term": "Cantilever", "definition": "Element projecting outward while supported only at one end.", "category": "Structure & Supports"}, {"term": "Arch", "definition": "Curved structure spanning an opening.", "category": "Openings, Doors & Windows"}, {"term": "Voussoir", "definition": "Wedge-shaped stone forming part of an arch.", "category": "Openings, Doors & Windows"}, {"term": "Keystone", "definition": "Central wedge-shaped stone at the crown of an arch.", "category": "Openings, Doors & Windows"}, {"term": "Jamb", "definition": "Vertical side of a door or window opening.", "category": "Openings, Doors & Windows"}, {"term": "Sill", "definition": "Horizontal member at the bottom of a window or opening.", "category": "Openings, Doors & Windows"}, {"term": "Mullion", "definition": "Vertical divider between window panes or sections.", "category": "Openings, Doors & Windows"}, {"term": "Transom", "definition": "Horizontal divider above a door or within a window.", "category": "Openings, Doors & Windows"}, {"term": "Casement", "definition": "Window hinged at the side.", "category": "Openings, Doors & Windows"}, {"term": "Sash", "definition": "Movable framed portion of a window.", "category": "Openings, Doors & Windows"}, {"term": "Bay window", "definition": "Window projecting outward from the building wall.", "category": "Openings, Doors & Windows"}, {"term": "Oriel", "definition": "Upper-story projecting window supported from below rather than reaching the ground.", "category": "Openings, Doors & Windows"}, {"term": "Clerestory", "definition": "High-level row of windows used to bring light deep into a building.", "category": "Openings, Doors & Windows"}, {"term": "Fanlight", "definition": "Semicircular or fan-shaped window above a door.", "category": "Openings, Doors & Windows"}, {"term": "Portico", "definition": "Covered entrance supported by columns.", "category": "Openings, Doors & Windows"}, {"term": "Portal", "definition": "Architecturally emphasized entrance or doorway.", "category": "Openings, Doors & Windows"}, {"term": "Balustrade", "definition": "Railing consisting of a handrail supported by repeated small posts.", "category": "Stairs, Balconies & Railings"}, {"term": "Baluster", "definition": "One individual vertical member within a balustrade.", "category": "Stairs, Balconies & Railings"}, {"term": "Banister", "definition": "Handrail and supporting structure along a staircase.", "category": "Stairs, Balconies & Railings"}, {"term": "Newel", "definition": "Substantial post at the beginning, end, or turn of a staircase.", "category": "Stairs, Balconies & Railings"}, {"term": "Tread", "definition": "Horizontal surface of a stair that you step on.", "category": "Stairs, Balconies & Railings"}, {"term": "Riser", "definition": "Vertical face between two stair treads.", "category": "Stairs, Balconies & Railings"}, {"term": "Landing", "definition": "Flat platform between flights of stairs.", "category": "Stairs, Balconies & Railings"}, {"term": "Flight", "definition": "Continuous sequence of stairs between landings.", "category": "Stairs, Balconies & Railings"}, {"term": "Stringer", "definition": "Inclined structural member supporting stair treads.", "category": "Stairs, Balconies & Railings"}, {"term": "Loggia", "definition": "Covered gallery or corridor open to the exterior on one or more sides.", "category": "Stairs, Balconies & Railings"}, {"term": "Veranda", "definition": "Roofed platform running along the exterior of a building.", "category": "Stairs, Balconies & Railings"}, {"term": "Terrace", "definition": "Level outdoor area adjoining a building.", "category": "Stairs, Balconies & Railings"}, {"term": "Arcade", "definition": "Series of arches supported by columns or piers.", "category": "Stairs, Balconies & Railings"}, {"term": "Capital", "definition": "Top portion of a column.", "category": "Classical Architecture"}, {"term": "Shaft", "definition": "Main vertical body of a column.", "category": "Classical Architecture"}, {"term": "Base", "definition": "Lowest portion of a column.", "category": "Classical Architecture"}, {"term": "Entablature", "definition": "Horizontal structure supported by classical columns.", "category": "Classical Architecture"}, {"term": "Architrave", "definition": "Lowest horizontal section of an entablature.", "category": "Classical Architecture"}, {"term": "Frieze", "definition": "Decorative horizontal band, often above the architrave.", "category": "Classical Architecture"}, {"term": "Pilaster", "definition": "Shallow rectangular column projecting slightly from a wall.", "category": "Classical Architecture"}, {"term": "Colonnade", "definition": "Long sequence of columns.", "category": "Classical Architecture"}, {"term": "Order", "definition": "Standardized classical column system, such as Doric, Ionic, or Corinthian.", "category": "Classical Architecture"}, {"term": "Doric", "definition": "Robust classical order with relatively simple capitals.", "category": "Classical Architecture"}, {"term": "Ionic", "definition": "Classical order recognized by scroll-shaped capitals.", "category": "Classical Architecture"}, {"term": "Corinthian", "definition": "Ornate classical order with capitals decorated with leaves.", "category": "Classical Architecture"}, {"term": "Façade", "definition": "Exterior face of a building, especially its principal front.", "category": "Façades & Exterior Details"}, {"term": "Fenestration", "definition": "Arrangement and design of windows and other openings across a façade.", "category": "Façades & Exterior Details"}, {"term": "Masonry", "definition": "Construction using brick, stone, or concrete units.", "category": "Façades & Exterior Details"}, {"term": "Cladding", "definition": "Exterior material applied over a building's structural enclosure.", "category": "Façades & Exterior Details"}, {"term": "Coursing", "definition": "Horizontal arrangement of masonry units.", "category": "Façades & Exterior Details"}, {"term": "Quoin", "definition": "Emphasized masonry blocks at the external corner of a building.", "category": "Façades & Exterior Details"}, {"term": "Rustication", "definition": "Masonry treatment using deeply defined joints and rough or exaggerated stone surfaces.", "category": "Façades & Exterior Details"}, {"term": "String course", "definition": "Narrow horizontal band projecting from a façade.", "category": "Façades & Exterior Details"}, {"term": "Recess", "definition": "Portion of a wall or space set back from the surrounding surface.", "category": "Façades & Exterior Details"}, {"term": "Reveal", "definition": "Exposed side surface of a wall opening between the frame and outer wall face.", "category": "Façades & Exterior Details"}, {"term": "Niche", "definition": "Shallow recess designed to hold an object or sculpture.", "category": "Façades & Exterior Details"}, {"term": "Plinth", "definition": "Projecting base supporting a wall, column, statue, or structure.", "category": "Façades & Exterior Details"}, {"term": "Atrium", "definition": "Large central interior space, often open through several floors.", "category": "Interior Elements"}, {"term": "Vestibule", "definition": "Small transitional space immediately inside an entrance.", "category": "Interior Elements"}, {"term": "Foyer", "definition": "Entrance hall or reception space.", "category": "Interior Elements"}, {"term": "Gallery", "definition": "Long room or circulation space, sometimes used for displaying art.", "category": "Interior Elements"}, {"term": "Mezzanine", "definition": "Intermediate partial floor between two principal floors.", "category": "Interior Elements"}, {"term": "Alcove", "definition": "Small recessed area within a room.", "category": "Interior Elements"}, {"term": "Coffer", "definition": "Recessed panel in a ceiling.", "category": "Interior Elements"}, {"term": "Coffered ceiling", "definition": "Ceiling composed of repeated recessed panels.", "category": "Interior Elements"}, {"term": "Vault", "definition": "Arched ceiling or roof structure.", "category": "Interior Elements"}, {"term": "Barrel vault", "definition": "Continuous semicircular vault resembling a tunnel.", "category": "Interior Elements"}, {"term": "Groin vault", "definition": "Vault created by the intersection of two barrel vaults.", "category": "Interior Elements"}, {"term": "Dome", "definition": "Rounded roof or ceiling structure.", "category": "Interior Elements"}, {"term": "Rotunda", "definition": "Circular room or building, often topped by a dome.", "category": "Interior Elements"}, {"term": "Wainscoting", "definition": "Decorative paneling covering the lower portion of an interior wall.", "category": "Interior Elements"}, {"term": "Molding", "definition": "Shaped decorative strip used around walls, ceilings, doors, or windows.", "category": "Interior Elements"}, {"term": "Skirting / Baseboard", "definition": "Trim running along the bottom of an interior wall.", "category": "Interior Elements"}, {"term": "Nave", "definition": "Main central area of a church where the congregation sits.", "category": "Church & Cathedral Architecture"}, {"term": "Aisle", "definition": "Passage running alongside the nave.", "category": "Church & Cathedral Architecture"}, {"term": "Transept", "definition": "Section crossing the nave, producing a cruciform plan.", "category": "Church & Cathedral Architecture"}, {"term": "Crossing", "definition": "Area where the nave and transept intersect.", "category": "Church & Cathedral Architecture"}, {"term": "Apse", "definition": "Semicircular or polygonal termination of a church, typically behind the altar.", "category": "Church & Cathedral Architecture"}, {"term": "Chancel", "definition": "Area surrounding the altar, traditionally reserved for clergy and choir.", "category": "Church & Cathedral Architecture"}, {"term": "Choir", "definition": "Portion of a church where the choir sits.", "category": "Church & Cathedral Architecture"}, {"term": "Sanctuary", "definition": "Sacred area around the principal altar.", "category": "Church & Cathedral Architecture"}, {"term": "Narthex", "definition": "Entrance or vestibule at the western end of a church.", "category": "Church & Cathedral Architecture"}, {"term": "Ambulatory", "definition": "Passage allowing circulation around the apse or sanctuary.", "category": "Church & Cathedral Architecture"}, {"term": "Crypt", "definition": "Underground chamber, frequently beneath a church.", "category": "Church & Cathedral Architecture"}, {"term": "Belfry", "definition": "Structure or chamber containing bells.", "category": "Church & Cathedral Architecture"}, {"term": "Rose window", "definition": "Large circular ornamental window, particularly associated with Gothic churches.", "category": "Church & Cathedral Architecture"}, {"term": "Tracery", "definition": "Decorative stone framework dividing Gothic windows.", "category": "Church & Cathedral Architecture"}, {"term": "Axis", "definition": "Imaginary organizing line through a building or space.", "category": "Spatial Terms"}, {"term": "Threshold", "definition": "Point or zone of transition between spaces.", "category": "Spatial Terms"}, {"term": "Datum", "definition": "Reference line, plane, or element around which a composition is organized.", "category": "Spatial Terms"}, {"term": "Bay", "definition": "Repeated structural or spatial division of a building.", "category": "Spatial Terms"}, {"term": "Span", "definition": "Distance between two structural supports.", "category": "Spatial Terms"}, {"term": "Void", "definition": "Intentionally unoccupied volume or opening.", "category": "Spatial Terms"}, {"term": "Massing", "definition": "Overall three-dimensional composition of a building's volumes.", "category": "Spatial Terms"}, {"term": "Volume", "definition": "Three-dimensional space or solid form.", "category": "Spatial Terms"}, {"term": "Circulation", "definition": "Routes people use to move through a building.", "category": "Spatial Terms"}, {"term": "Enfilade", "definition": "Sequence of rooms aligned so their doorways form a continuous axis.", "category": "Spatial Terms"}, {"term": "Courtyard", "definition": "Outdoor space enclosed or mostly enclosed by a building.", "category": "Spatial Terms"}, {"term": "Lightwell", "definition": "Vertical opening designed to bring daylight into internal spaces.", "category": "Spatial Terms"}];
let deck = [...allCards];
let index = 0;
let flipped = false;

const card = document.getElementById('card');
const term = document.getElementById('term');
const definition = document.getElementById('definition');
const categoryFront = document.getElementById('categoryFront');
const categoryBack = document.getElementById('categoryBack');
const count = document.getElementById('count');
const progressBar = document.getElementById('progressBar');
const categorySelect = document.getElementById('category');

const categories = ["All categories", ...new Set(allCards.map(c => c.category))];
for (const cat of categories) {
  const option = document.createElement('option');
  option.value = cat;
  option.textContent = cat;
  categorySelect.appendChild(option);
}

function render() {
  if (!deck.length) return;
  const item = deck[index];
  term.textContent = item.term;
  definition.textContent = item.definition;
  categoryFront.textContent = item.category;
  categoryBack.textContent = item.term + " · " + item.category;
  count.textContent = `${index + 1} of ${deck.length}`;
  progressBar.style.width = `${((index + 1) / deck.length) * 100}%`;
  card.classList.toggle('flipped', flipped);
}

function setFlipped(value) {
  flipped = value;
  card.classList.toggle('flipped', flipped);
}

function flipCard() {
  setFlipped(!flipped);
}

function nextCard() {
  index = (index + 1) % deck.length;
  setFlipped(false);
  render();
}

function prevCard() {
  index = (index - 1 + deck.length) % deck.length;
  setFlipped(false);
  render();
}

function shuffleDeck() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  index = 0;
  setFlipped(false);
  render();
}

function applyCategory() {
  const selected = categorySelect.value;
  deck = selected === "All categories"
    ? [...allCards]
    : allCards.filter(c => c.category === selected);
  index = 0;
  setFlipped(false);
  render();
}

document.getElementById('flip').addEventListener('click', flipCard);
document.getElementById('next').addEventListener('click', nextCard);
document.getElementById('prev').addEventListener('click', prevCard);
document.getElementById('shuffle').addEventListener('click', shuffleDeck);
document.getElementById('reset').addEventListener('click', () => {
  categorySelect.value = "All categories";
  deck = [...allCards];
  index = 0;
  setFlipped(false);
  render();
});
categorySelect.addEventListener('change', applyCategory);
card.addEventListener('click', flipCard);

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'BUTTON') return;
  if (e.code === 'Space') { e.preventDefault(); flipCard(); }
  else if (e.key === 'ArrowRight') nextCard();
  else if (e.key === 'ArrowLeft') prevCard();
  else if (e.key.toLowerCase() === 's') shuffleDeck();
});

render();
</script>
</body>
</html>
